# Exam notification emails (sent on a background thread).
#
# Demo DB users use @oes.com — those addresses are not real inboxes. Gmail would bounce and YOU (mail.from)
# get "Mail Delivery Subsystem" failures. By default we skip sending to these domains.
# To mail a real teacher, set their users.email in the database to Gmail (etc.), or remove oes.com below.
#
mail.skip.recipient.domains=oes.com,example.com,example.org,test.com
#
# --- Gmail (smtp.gmail.com) ---
# Error 535 "Username and Password not accepted" means Google rejected the login. Fix:
#   1) mail.user = full Gmail address (e.g. you@gmail.com)
#   2) mail.password = 16-character App Password (Google Account > Security > 2-Step Verification ON,
#      then App passwords). NOT your normal Gmail password. Remove spaces if you pasted "xxxx xxxx ...".
#   3) mail.from = same as mail.user unless you configured "Send mail as" in Gmail settings.
#
mail.enabled=false

mail.smtp.host=smtp.gmail.com
mail.smtp.port=587
mail.smtp.starttls.enable=true
mail.smtp.starttls.required=true
mail.smtp.auth=true
mail.smtp.ssl.protocols=TLSv1.2

mail.user=shrutiwork500@gmail.com
mail.password=pdfuskhrnmiaqxkz
mail.from=shrutiwork500@gmail.com
mail.from.name=Online Examination System

